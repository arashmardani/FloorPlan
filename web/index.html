<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فضاهای نقشه</title><style>body{font:16px sans-serif;max-width:1100px;margin:auto;padding:1rem;color:#19354a}svg{width:100%;height:52vh;background:#f4f8fa;border:1px solid #999}polygon,polyline{stroke:#456;stroke-width:1.5;vector-effect:non-scaling-stroke}polygon.room{cursor:pointer;fill:#b8e1d3}polygon.room:hover,polygon.active{fill:#ffc978}text{pointer-events:none}table{border-collapse:collapse;width:100%}td,th{padding:.4em;border:1px solid #ddd}button,input,select{padding:.4em;margin:.25em}</style><h1>برچسب‌گذاری فضاهای نقشه</h1><form id="up"><input type="file" name="file" accept=".dwg,.dxf" required><label>واحد ترسیم: <select name="unit" required><option value="">انتخاب کنید</option><option value="mm">میلی‌متر</option><option value="cm">سانتی‌متر</option><option value="m">متر</option></select></label><button>بارگذاری</button></form><p id="msg" role="status"></p><svg id="map" aria-label="نمای نقشه"></svg><form id="editor" hidden><strong id="selected"></strong> <input id="nameBox" maxlength="120" aria-label="برچسب"><button>ذخیره برچسب</button></form><p><a id="download" hidden>دریافت JSON نقشه و اندازه‌ها</a></p><table><thead><tr><th>فضا / لایه</th><th>برچسب</th><th>مساحت (متر مربع)</th><th>محیط (متر)</th><th>اضلاع به ترتیب (متر)</th></tr></thead><tbody id="rows"></tbody></table><script src="/assets/ui.js"></script></html>
